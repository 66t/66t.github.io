<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>分子物态相变模拟 (固·液·气)</title>
    <style>
        body { margin: 0; padding: 20px; background-color: #0f141c; color: #e2e8f0; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
        h2 { margin-bottom: 10px; color: #38bdf8; }
        .container { max-width: 800px; width: 100%; }
        canvas { background-color: #05070a; border: 2px solid #1e293b; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .control-panel { background-color: #1e293b; padding: 15px 20px; border-radius: 8px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 15px; }
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 0.9rem; color: #94a3b8; }
        input[type="range"] { width: 100%; accent-color: #38bdf8; }
        .value-display { font-weight: bold; color: #38bdf8; margin-left: 5px;}
        .hint { grid-column: 1 / -1; font-size: 0.85rem; color: #fbbf24; background: rgba(251, 191, 36, 0.1); padding: 8px; border-radius: 4px;}
    </style>
</head>
<body>

<div class="container">
    <h2>宏观物态相变模拟 (Lennard-Jones)</h2>
    <canvas id="simCanvas" width="800" height="450"></canvas>

    <div class="control-panel">
        <div class="hint">
            💡 <b>测试指南：</b><br>
            ❄️ <b>固态：</b>温度调到 0 ~ 0.5，吸引力 > 10（分子会整齐排列沉在底部）。<br>
            💧 <b>液态：</b>温度调到 1.5 ~ 2.5，吸引力 6 ~ 8（分子在底部像水一样流动）。<br>
            ☁️ <b>气态：</b>温度调到 4.0 以上，或将吸引力降为 1（分子挣脱束缚充满全屏）。
        </div>

        <div class="control-group">
            <label>系统温度 (动能): <span id="tempVal" class="value-display">2.0</span></label>
            <input type="range" id="temperature" min="0" max="6" step="0.1" value="2.0">
        </div>
        <div class="control-group">
            <label>分子间吸引力 (ε): <span id="epsVal" class="value-display">6.0</span></label>
            <input type="range" id="epsilon" min="0" max="20" step="0.5" value="6.0">
        </div>
        <div class="control-group">
            <label>重力场 (g): <span id="gravVal" class="value-display">0.2</span></label>
            <input type="range" id="gravity" min="0" max="1" step="0.05" value="0.2">
        </div>
        <div class="control-group">
            <label>分子核心半径 (σ): <span id="sigmaVal" class="value-display">18</span></label>
            <input type="range" id="sigma" min="10" max="25" step="1" value="18">
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    let particles = [];
    const PARTICLE_COUNT = 250; // 增加分子数量以体现宏观流体
    const dt = 0.1;

    const inputs = {
        temp: document.getElementById('temperature'),
        eps: document.getElementById('epsilon'),
        grav: document.getElementById('gravity'),
        sigma: document.getElementById('sigma')
    };
    const displays = {
        temp: document.getElementById('tempVal'),
        eps: document.getElementById('epsVal'),
        grav: document.getElementById('gravVal'),
        sigma: document.getElementById('sigmaVal')
    };

    function getParams() {
        return {
            temp: parseFloat(inputs.temp.value),
            epsilon: parseFloat(inputs.eps.value),
            gravity: parseFloat(inputs.grav.value),
            sigma: parseFloat(inputs.sigma.value)
        };
    }

    Object.keys(inputs).forEach(key => {
        inputs[key].addEventListener('input', () => {
            displays[key].innerText = inputs[key].value;
        });
    });

    class Particle {
        constructor(x, y) {
            this.x = x; this.y = y;
            this.vx = (Math.random() - 0.5) * 5;
            this.vy = (Math.random() - 0.5) * 5;
            this.fx = 0; this.fy = 0;
        }
    }

    // 密集阵列初始化
    function initSimulation() {
        particles = [];
        const sigma = getParams().sigma;
        let cols = Math.floor(canvas.width / (sigma * 1.5));
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            let row = Math.floor(i / cols);
            let col = i % cols;
            // 在屏幕上方整齐生成，让它们受重力落下
            let x = 50 + col * (sigma * 1.5) + (row % 2) * (sigma * 0.5);
            let y = 50 + row * (sigma * 1.5);
            particles.push(new Particle(x, y));
        }
    }

    function updatePhysics() {
        const p = getParams();
        const cutoff2 = Math.pow(p.sigma * 3.0, 2);
        const maxForce = 500; // 防止LJ势数值爆炸

        // 重置受力并加入重力
        for (let i = 0; i < particles.length; i++) {
            particles[i].fx = 0;
            particles[i].fy = p.gravity * 10;
        }

        // 计算 Lennard-Jones 作用力
        for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
                let dx = particles[j].x - particles[i].x;
                let dy = particles[j].y - particles[i].y;
                let r2 = dx * dx + dy * dy;

                if (r2 < cutoff2 && r2 > 1) {
                    let r = Math.sqrt(r2);
                    let sigmaOverR = p.sigma / r;
                    let sr6 = Math.pow(sigmaOverR, 6);
                    let sr12 = sr6 * sr6;

                    // LJ力公式
                    let fMag = (24 * p.epsilon / r) * (2 * sr12 - sr6);

                    // 核心修复：死区截断，防止距离过近导致斥力无穷大炸屏
                    if (fMag > maxForce) fMag = maxForce;
                    if (fMag < -maxForce) fMag = -maxForce;

                    let fx = fMag * (dx / r);
                    let fy = fMag * (dy / r);

                    particles[i].fx -= fx; particles[i].fy -= fy;
                    particles[j].fx += fx; particles[j].fy += fy;
                }
            }
        }

        // 动能统计 (用于恒温器)
        let currentKineticEnergy = 0;
        for (let i = 0; i < particles.length; i++) {
            currentKineticEnergy += 0.5 * (particles[i].vx**2 + particles[i].vy**2);
        }
        let currentTemp = currentKineticEnergy / particles.length;
        let targetTemp = p.temp * 10; // 放大比例便于观察

        // Berendsen 恒温器因子：平滑地将当前动能缩放到目标温度
        let thermostatFactor = 1.0;
        if (currentTemp > 0.1) {
            thermostatFactor = Math.sqrt(1.0 + 0.05 * (targetTemp / currentTemp - 1.0));
        }

        // 状态更新与边界处理
        for (let i = 0; i < particles.length; i++) {
            let pt = particles[i];

            pt.vx += pt.fx * dt;
            pt.vy += pt.fy * dt;

            // 应用温度缩放
            pt.vx *= thermostatFactor;
            pt.vy *= thermostatFactor;

            // 速度上限，防止飞出屏幕
            const speedLimit = 30;
            let speed = Math.sqrt(pt.vx**2 + pt.vy**2);
            if(speed > speedLimit) {
                pt.vx = (pt.vx / speed) * speedLimit;
                pt.vy = (pt.vy / speed) * speedLimit;
            }

            pt.x += pt.vx * dt;
            pt.y += pt.vy * dt;

            // 墙壁碰撞与微弱能量损耗
            let rEff = p.sigma * 0.5;
            let bounceLoss = 0.8;
            if (pt.x < rEff) { pt.x = rEff; pt.vx *= -bounceLoss; }
            if (pt.x > canvas.width - rEff) { pt.x = canvas.width - rEff; pt.vx *= -bounceLoss; }
            // 底部和顶部
            if (pt.y < rEff) { pt.y = rEff; pt.vy *= -bounceLoss; }
            if (pt.y > canvas.height - rEff) { pt.y = canvas.height - rEff; pt.vy *= -bounceLoss; }
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const p = getParams();

        // 绘制流体/固体颜色区分：基于分子速度(温度)和位置
        for (let i = 0; i < particles.length; i++) {
            let pt = particles[i];
            let speed = Math.sqrt(pt.vx**2 + pt.vy**2);

            // 速度越快颜色越偏红（气态/高温），速度越慢越偏蓝（固态/低温）
            let rColor = Math.min(255, speed * 15);
            let bColor = Math.min(255, 255 - speed * 5);

            ctx.beginPath();
            ctx.arc(pt.x, pt.y, p.sigma * 0.5, 0, Math.PI * 2);
            ctx.fillStyle = `rgb(${rColor}, 150, ${bColor})`;
            ctx.fill();

            // 画一圈淡淡的作用域
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, p.sigma * 0.8, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.fill();
        }
    }

    function loop() {
        // 为了物理稳定性，一帧分为多次小步长积分
        for(let step=0; step<3; step++){
            updatePhysics();
        }
        draw();
        requestAnimationFrame(loop);
    }

    initSimulation();
    loop();
</script>
</body>
</html>
